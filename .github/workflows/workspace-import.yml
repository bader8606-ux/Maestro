name: Import authorized workspace records
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare an ephemeral key, check encrypted records, or apply them
        type: choice
        required: true
        options: [prepare, dry-run, apply]
      envelope:
        description: Encrypted envelope only; never enter names, amounts, files or credentials
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: maestro-workspace-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Execute protected import
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          IMPORT_MODE: ${{ inputs.mode }}
          IMPORT_ENVELOPE: ${{ inputs.envelope }}
        run: node scripts/workspace-import.mjs
