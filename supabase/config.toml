project_id = "maestro"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = false

[local_smtp]
enabled = false

[analytics]
enabled = false

[auth]
site_url = "https://bader8606-ux.github.io/Maestro/"
enable_signup = false
jwt_expiry = 3600
minimum_password_length = 12

[auth.email]
# Enables the email provider; global auth.enable_signup=false blocks registration.
enable_signup = true
enable_confirmations = true

[functions.maestro-api]
# Verify every bearer token with Supabase Auth in the handler, including
# asymmetric tokens supported by newer projects. No protected route is public.
verify_jwt = false
